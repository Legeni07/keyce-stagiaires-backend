version: "3.8"

services:

  # ── Base de données MySQL ─────────────────────────────────
  db:
    image: mysql:8.0
    container_name: keyce_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root2025
      MYSQL_DATABASE:      keyce_stagiaires
      MYSQL_USER:          keyce
      MYSQL_PASSWORD:      keyce2025
    volumes:
      - keyce_db_data:/var/lib/mysql
      - ./database/migrations.sql:/docker-entrypoint-initdb.d/01-migrations.sql
    ports:
      - "3307:3306"   # 3307 en local pour éviter le conflit avec MySQL local
    networks:
      - keyce_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ukeyce", "-pkeyce2025"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend PHP/Apache ────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyce_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST:    db
      DB_PORT:    3306
      DB_NAME:    keyce_stagiaires
      DB_USER:    keyce
      DB_PASS:    keyce2025
      JWT_SECRET: keyce_secret_jwt_2025_exam_b2
    ports:
      - "8001:80"
    volumes:
      - ./uploads:/var/www/html/uploads
    networks:
      - keyce_net

volumes:
  keyce_db_data:

networks:
  keyce_net:
    driver: bridge
